<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2c7a57">
<meta name="description" content="平日だけ禁酒するためのカレンダー。連続記録と月末精算、体重を記録します。">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-180.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="平日禁酒">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<!-- ARTIFACT:BEGIN -->
<title>平日禁酒トラッカー</title>
<style>
:root{
  --paper:#edefea; --card:#fbfbf8; --sunk:#e7eae3; --ink:#1d211e; --muted:#6d746c; --line:#dbe0d7;
  --green:#2c7a57; --green-bg:#dfeee6; --red:#b04a3c; --red-bg:#f6e4e0;
  --blue:#35617f; --blue-bg:#e2ebf1; --gold:#94711f;
  --shadow:0 1px 1px rgba(29,33,30,.04), 0 10px 22px -14px rgba(29,33,30,.28);
  --mincho:"Shippori Mincho B1",  "Hiragino Mincho ProN", "Yu Mincho", serif;
  --gothic:"Zen Kaku Gothic New", system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#14171500; --paper:#141715; --card:#1d211e; --sunk:#252a26; --ink:#e8ece7; --muted:#8d958b; --line:#2c322d;
    --green:#5cb287; --green-bg:#182b22; --red:#dd8172; --red-bg:#2e1d1a;
    --blue:#7fb0cb; --blue-bg:#16242c; --gold:#c9a24c;
    --shadow:0 1px 1px rgba(0,0,0,.25), 0 12px 24px -16px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#141715; --card:#1d211e; --sunk:#252a26; --ink:#e8ece7; --muted:#8d958b; --line:#2c322d;
  --green:#5cb287; --green-bg:#182b22; --red:#dd8172; --red-bg:#2e1d1a;
  --blue:#7fb0cb; --blue-bg:#16242c; --gold:#c9a24c;
  --shadow:0 1px 1px rgba(0,0,0,.25), 0 12px 24px -16px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink); font-family:var(--gothic);
  font-size:15px; line-height:1.65; -webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.app{max-width:520px;margin:0 auto;padding:18px 16px calc(48px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.topbar{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.brand{font-family:var(--mincho);font-weight:700;font-size:18px;letter-spacing:.06em}
.sync{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px;white-space:nowrap}
.sync::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--muted)}
.sync[data-state="synced"]::before{background:var(--green)}
.sync[data-state="saving"]::before,.sync[data-state="pending"]::before{background:var(--gold)}
.sync[data-state="retry"]::before{background:var(--red)}

.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
h2{font-family:var(--mincho);font-size:14px;font-weight:600;letter-spacing:.1em;margin:0 0 12px;color:var(--ink)}

/* 連続記録 */
.streak-card{text-align:center;padding:20px 16px 18px;background:
  linear-gradient(178deg,var(--green-bg),var(--card) 62%)}
.eyebrow{font-size:11px;letter-spacing:.22em;color:var(--muted)}
.streak{font-family:var(--mincho);font-weight:700;color:var(--green);font-size:68px;line-height:1;letter-spacing:-.01em;margin-top:8px;font-variant-numeric:tabular-nums}
.streak .unit{font-size:20px;margin-left:6px;letter-spacing:.05em}
.streak-note{font-size:13px;color:var(--muted);margin-top:8px}
.best{display:inline-block;margin-top:10px;font-size:11px;letter-spacing:.06em;color:var(--gold);border:1px solid currentColor;border-radius:999px;padding:2px 12px;opacity:.9}
.today-ask{display:flex;gap:8px;margin-top:16px}
.ask{flex:1;border-radius:11px;padding:11px 4px;font-size:14px;font-weight:700;border:1.5px solid var(--line);background:var(--card);transition:transform .08s}
.ask:active{transform:scale(.97)}
.ask.s{color:var(--green)} .ask.s[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.ask.d{color:var(--red)} .ask.d[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}

/* 精算 */
.ledger-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.amount{font-size:36px;font-weight:900;letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums}
.amount.plus{color:var(--green)} .amount.minus{color:var(--red)}
.amount-sub{font-size:12px;color:var(--muted)}
.settle{font-size:11px;color:var(--muted);text-align:right;line-height:1.5}
.settle b{display:block;font-size:14px;color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.bar{height:5px;border-radius:99px;background:var(--sunk);margin:14px 0 12px;display:flex;overflow:hidden}
.bar i{height:100%}
.bar .bs{background:var(--green)} .bar .bd{background:var(--red)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stat{background:var(--sunk);border-radius:10px;padding:8px 2px;text-align:center;font-size:10.5px;color:var(--muted);letter-spacing:.02em}
.stat b{display:block;font-size:18px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat.s b{color:var(--green)} .stat.d b{color:var(--red)} .stat.w b{color:var(--blue)}

/* カレンダー */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.month{font-family:var(--mincho);font-size:17px;font-weight:600;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.nav{width:32px;height:32px;border-radius:9px;background:var(--sunk);display:grid;place-items:center;font-size:15px;line-height:1}
.jump{font-size:11px;color:var(--blue);background:var(--blue-bg);border-radius:999px;padding:3px 11px;letter-spacing:.04em}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{margin-bottom:5px}
.dow span{text-align:center;font-size:10px;letter-spacing:.06em;color:var(--muted)}
.dow .sun{color:var(--red)} .dow .sat{color:var(--blue)}
.cell{aspect-ratio:1/1.1;border-radius:10px;background:var(--sunk);border:1px solid transparent;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;position:relative;transition:transform .07s}
.cell:active{transform:scale(.93)}
.cell.blank{background:none;pointer-events:none}
.cell .n{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.3}
.cell .m{font-size:13px;line-height:1.1;height:15px}
.cell .kg{font-size:9px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.2}
.cell.target{background:var(--card);border-color:var(--line)}
.cell.sober{background:var(--green-bg);border-color:transparent} .cell.sober .n{color:var(--green)}
.cell.drank{background:var(--red-bg);border-color:transparent} .cell.drank .n{color:var(--red)}
.cell.off .n{color:var(--muted);font-weight:500}
.cell.today{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.cell.future{opacity:.4}
.cell .hol{position:absolute;top:1px;right:3px;font-size:8px;color:var(--gold);letter-spacing:0}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;font-size:10.5px;color:var(--muted)}
.legend i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:4px;vertical-align:0}

/* 体重 */
.chart{width:100%;height:auto;display:block;margin-top:12px}
.chart .gl{stroke:var(--line)} .chart .ln{fill:none;stroke:var(--blue);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--blue);opacity:.09} .chart .dot{fill:var(--card);stroke:var(--blue);stroke-width:2}
.chart .goal{stroke:var(--gold);stroke-width:1.2;stroke-dasharray:3 3}
.chart text{font-size:8px;fill:var(--muted);font-family:var(--gothic)}
.blank-note{text-align:center;color:var(--muted);font-size:12.5px;padding:20px 0 6px;line-height:1.8}

/* 月別 */
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:10px 0;border-bottom:1px solid var(--line);text-align:left}
.row:last-of-type{border-bottom:none}
.row .l{display:flex;flex-direction:column;gap:1px;min-width:0}
.row .t{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.4}
.row .d{font-size:11px;color:var(--muted);line-height:1.4}
.row .v{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.v.plus{color:var(--green)} .v.minus{color:var(--red)}
.tag{font-size:9.5px;letter-spacing:.04em;color:var(--blue);background:var(--blue-bg);border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:1.5px}
.grand{display:flex;align-items:baseline;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1.5px solid var(--line)}
.grand span{font-family:var(--mincho);font-size:13px;letter-spacing:.06em}
.grand b{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}

/* 設定 */
details>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-family:var(--mincho);font-size:14px;letter-spacing:.1em;color:var(--muted)}
details>summary::-webkit-details-marker{display:none}
details[open]>summary{margin-bottom:14px}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.field:last-of-type{border-bottom:none}
.field small{display:block;font-size:11px;color:var(--muted);line-height:1.5}
input[type=number]{font:inherit;font-family:var(--gothic);background:var(--sunk);border:1px solid var(--line);color:var(--ink);
  border-radius:9px;padding:7px 10px;width:108px;text-align:right;font-variant-numeric:tabular-nums}
.switch{width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .15s}
.switch[aria-checked="true"]{background:var(--green)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}
.actions{display:flex;gap:8px;margin-top:14px}
.act{flex:1;text-align:center;background:var(--sunk);border-radius:10px;padding:10px;font-size:12.5px}
.act.warn{color:var(--red)}
.fine{font-size:11px;color:var(--muted);line-height:1.7;margin:14px 0 0}

/* 日別シート */
dialog{border:none;padding:0;background:none;width:100%;max-width:520px;margin:auto auto 0}
dialog::backdrop{background:rgba(10,14,11,.5)}
.sheet{background:var(--card);color:var(--ink);border-radius:18px 18px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom))}
@media (min-width:560px){dialog{margin:auto}.sheet{border-radius:18px}}
.sheet .date{font-family:var(--mincho);font-size:19px;font-weight:600;letter-spacing:.04em}
.sheet .kind{font-size:12px;color:var(--muted);margin-bottom:16px}
.choices{display:flex;gap:8px}
.choice{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:13px 4px;text-align:center;font-size:13px;font-weight:700;background:var(--card)}
.choice .ic{display:block;font-size:20px;line-height:1.3}
.choice[aria-pressed="true"].s{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.choice[aria-pressed="true"].d{background:var(--red-bg);border-color:var(--red);color:var(--red)}
.choice[aria-pressed="true"].n{border-color:var(--muted);color:var(--muted)}
.weigh{display:flex;align-items:center;gap:12px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.weigh label{flex:1;font-size:13.5px;font-weight:500}
.close{width:100%;margin-top:18px;background:var(--ink);color:var(--card);border-radius:12px;padding:13px;font-size:15px;font-weight:700;letter-spacing:.06em}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);background:var(--ink);color:var(--card);
  font-size:13px;padding:9px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.22s;z-index:9}
.toast.on{opacity:.96;transform:translate(-50%,0)}
</style>
<!-- ARTIFACT:HEAD-END -->
</head>
<body>
<div class="app">
  <div class="topbar">
    <span class="brand">平日禁酒トラッカー</span>
    <span class="sync" id="sync" data-state="local">読み込み中</span>
  </div>

  <section class="card streak-card">
    <div class="eyebrow">平日禁酒 連続記録</div>
    <div class="streak"><span id="streakNum">0</span><span class="unit">日</span></div>
    <div class="streak-note" id="streakNote"></div>
    <div class="best" id="best"></div>
    <div class="today-ask" id="todayAsk">
      <button class="ask s" id="askSober" aria-pressed="false">今日は飲んでない</button>
      <button class="ask d" id="askDrank" aria-pressed="false">今日は飲んだ</button>
    </div>
  </section>

  <section class="card">
    <div class="ledger-top">
      <div>
        <div class="amount" id="amount">¥0</div>
        <div class="amount-sub" id="amountSub"></div>
      </div>
      <div class="settle" id="settle"></div>
    </div>
    <div class="bar" id="bar"></div>
    <div class="stats">
      <div class="stat s"><b id="nSober">0</b>禁酒した</div>
      <div class="stat d"><b id="nDrank">0</b>飲んだ</div>
      <div class="stat"><b id="nLeft">0</b>残り平日</div>
      <div class="stat"><b id="nMax">¥0</b>満額なら</div>
    </div>
  </section>

  <section class="card">
    <div class="cal-head">
      <button class="nav" id="prev" aria-label="前の月">‹</button>
      <div style="display:flex;align-items:center;gap:10px">
        <span class="month" id="month"></span>
        <button class="jump" id="jump">今月</button>
      </div>
      <button class="nav" id="next" aria-label="次の月">›</button>
    </div>
    <div class="dow"><span class="sun">日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span class="sat">土</span></div>
    <div class="grid" id="grid"></div>
    <div class="legend">
      <span><i style="background:var(--green)"></i>禁酒</span>
      <span><i style="background:var(--red)"></i>飲んだ</span>
      <span><i style="background:var(--card);border:1px solid var(--line)"></i>平日・未記録</span>
      <span><i style="background:var(--sunk)"></i>対象外（土日祝）</span>
    </div>
  </section>

  <section class="card">
    <h2>体　重</h2>
    <div class="stats">
      <div class="stat w"><b id="wNow">–</b>いま</div>
      <div class="stat w"><b id="wAll">–</b>開始から</div>
      <div class="stat w"><b id="wMonth">–</b>この月</div>
      <div class="stat w"><b id="wGoal">–</b>目標まで</div>
    </div>
    <div id="chart"></div>
  </section>

  <section class="card">
    <h2>月末精算</h2>
    <div id="history"></div>
    <div class="grand"><span>累計（旦那との貸し借り）</span><b id="grand">¥0</b></div>
  </section>

  <details class="card">
    <summary><span>設定とデータ</span><span aria-hidden="true">▾</span></summary>
    <div class="field">
      <span>1日あたりの金額<small>禁酒したらもらう／飲んだら払う</small></span>
      <input type="number" id="setAmount" min="0" step="100" inputmode="numeric" aria-label="1日あたりの金額">
    </div>
    <div class="field">
      <span>祝日は対象外にする<small>祝日は飲んでもノーカウント</small></span>
      <button class="switch" id="setHoliday" role="switch" aria-checked="true" aria-label="祝日は対象外にする"></button>
    </div>
    <div class="field">
      <span>目標体重（kg）<small>グラフに目標ラインを引きます</small></span>
      <input type="number" id="setGoal" step="0.1" min="0" inputmode="decimal" placeholder="未設定" aria-label="目標体重">
    </div>
    <div class="actions">
      <button class="act" id="exportBtn">バックアップを保存</button>
      <button class="act" id="importBtn">バックアップから復元</button>
    </div>
    <div class="actions">
      <button class="act warn" id="resetBtn">記録をすべて消す</button>
    </div>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
    <p class="fine" id="storageNote"></p>
  </details>
</div>

<dialog id="sheet"><form method="dialog" class="sheet">
  <div class="date" id="sheetDate"></div>
  <div class="kind" id="sheetKind"></div>
  <div class="choices">
    <button type="button" class="choice s" data-status="sober" aria-pressed="false"><span class="ic">🍵</span>禁酒した</button>
    <button type="button" class="choice d" data-status="drank" aria-pressed="false"><span class="ic">🍺</span>飲んだ</button>
    <button type="button" class="choice n" data-status="" aria-pressed="false"><span class="ic">－</span>未記録</button>
  </div>
  <div class="weigh">
    <label for="sheetWeight">体重<small id="sheetHint"></small></label>
    <input type="number" id="sheetWeight" step="0.1" min="0" inputmode="decimal" placeholder="kg">
  </div>
  <button class="close" value="close">閉じる</button>
</form></dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";
const LS_KEY="heijitsu-kinshu-v1";
const DATA_PATH="data/records.json";
const DEFAULTS={amount:500,excludeHolidays:true,goalWeight:"",u:0};
const $=s=>document.getElementById(s);
const pad=n=>String(n).padStart(2,"0");
const now=()=>Date.now();

/* ============ データ ============ */
function normalize(src){
  const out={records:{},settings:{...DEFAULTS}};
  if(!src||typeof src!=="object")return out;
  const rec=src.records;
  if(rec&&typeof rec==="object"){
    for(const k of Object.keys(rec)){
      const v=rec[k];
      if(!/^\d{4}-\d{2}-\d{2}$/.test(k)||!v||typeof v!=="object")continue;
      const r={u:Number(v.u)||0};
      if(v.status==="sober"||v.status==="drank")r.status=v.status;
      const w=Number(v.weight);
      if(isFinite(w)&&w>0)r.weight=Math.round(w*10)/10;
      out.records[k]=r;
    }
  }
  if(src.settings&&typeof src.settings==="object"){
    const s=src.settings;
    out.settings={
      amount:Math.max(0,Math.round(Number(s.amount))||0),
      excludeHolidays:s.excludeHolidays!==false,
      goalWeight:(isFinite(Number(s.goalWeight))&&Number(s.goalWeight)>0)?Number(s.goalWeight):"",
      u:Number(s.u)||0
    };
  }
  return out;
}
function merge(a,b){ // 新しいタイムスタンプの側を採用
  const records={};
  const keys=new Set(Object.keys(a.records).concat(Object.keys(b.records)));
  keys.forEach(k=>{
    const x=a.records[k], y=b.records[k];
    records[k]=!x?y:!y?x:((y.u||0)>(x.u||0)?y:x);
  });
  const settings=((b.settings.u||0)>(a.settings.u||0))?b.settings:a.settings;
  return {records,settings};
}
let data=normalize(readLocal());
function readLocal(){
  try{ return JSON.parse(localStorage.getItem(LS_KEY)||"null"); }catch(e){ return null; }
}
function writeLocal(){
  try{ localStorage.setItem(LS_KEY,JSON.stringify(data)); }catch(e){ /* 保存不可でもクラウド側で残る */ }
}

/* ============ 日付 ============ */
const keyOf=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseKey=k=>{const p=k.split("-");return new Date(+p[0],+p[1]-1,+p[2]);};
const TODAY=(()=>{const d=new Date();d.setHours(0,0,0,0);return d;})();
const TODAY_KEY=keyOf(TODAY);
const WD=["日","月","火","水","木","金","土"];

/* 日本の祝日（祝日法にもとづく計算・1980〜2099） */
const holCache={};
function holidays(year){
  if(holCache[year])return holCache[year];
  const h={};
  const set=(m,d,name)=>{h[year+"-"+pad(m)+"-"+pad(d)]=name;};
  const nthMon=(m,n)=>1+((8-new Date(year,m-1,1).getDay())%7)+7*(n-1);
  const eq=base=>Math.floor(base+0.242194*(year-1980)-Math.floor((year-1980)/4));
  set(1,1,"元日"); set(1,nthMon(1,2),"成人の日");
  set(2,11,"建国記念の日"); set(2,23,"天皇誕生日");
  set(3,eq(20.8431),"春分の日");
  set(4,29,"昭和の日"); set(5,3,"憲法記念日"); set(5,4,"みどりの日"); set(5,5,"こどもの日");
  set(7,nthMon(7,3),"海の日"); set(8,11,"山の日");
  set(9,nthMon(9,3),"敬老の日"); set(9,eq(23.2488),"秋分の日");
  set(10,nthMon(10,2),"スポーツの日");
  set(11,3,"文化の日"); set(11,23,"勤労感謝の日");
  Object.keys(h).sort().forEach(k=>{            // 振替休日
    if(parseKey(k).getDay()!==0)return;
    const d=parseKey(k);
    do{ d.setDate(d.getDate()+1); }while(h[keyOf(d)]);
    h[keyOf(d)]="振替休日";
  });
  for(let m=1;m<=12;m++){                        // 国民の休日
    const last=new Date(year,m,0).getDate();
    for(let i=2;i<last;i++){
      const cur=new Date(year,m-1,i);
      if(h[keyOf(cur)]||cur.getDay()===0)continue;
      if(h[keyOf(new Date(year,m-1,i-1))]&&h[keyOf(new Date(year,m-1,i+1))])h[keyOf(cur)]="国民の休日";
    }
  }
  holCache[year]=h;
  return h;
}
const holidayOf=k=>holidays(parseKey(k).getFullYear())[k]||null;
function isTarget(k){
  const w=parseKey(k).getDay();
  if(w===0||w===6)return false;
  return !(data.settings.excludeHolidays&&holidayOf(k));
}
const statusOf=k=>(data.records[k]&&data.records[k].status)||"";
const weightOf=k=>{const r=data.records[k];return r&&typeof r.weight==="number"?r.weight:null;};

/* ============ 集計 ============ */
function streak(){
  const d=new Date(TODAY); let n=0;
  for(let i=0;i<3660;i++){
    const k=keyOf(d);
    if(isTarget(k)){
      const s=statusOf(k);
      if(s==="sober")n++;
      else if(s==="drank")break;
      else if(i!==0)break;          // 今日の未記録では途切れない
    }
    d.setDate(d.getDate()-1);
  }
  return n;
}
function best(){
  const keys=Object.keys(data.records).filter(k=>statusOf(k)).sort();
  if(!keys.length)return 0;
  const d=parseKey(keys[0]); let run=0,top=0;
  while(d<=TODAY){
    const k=keyOf(d);
    if(isTarget(k)){
      const s=statusOf(k);
      if(s==="sober"){run++;if(run>top)top=run;}
      else if(s==="drank"||k!==TODAY_KEY)run=0;
    }
    d.setDate(d.getDate()+1);
  }
  return top;
}
function monthStats(y,m){
  const last=new Date(y,m+1,0).getDate();
  let target=0,sober=0,drank=0,left=0;
  for(let i=1;i<=last;i++){
    const day=new Date(y,m,i), k=keyOf(day);
    if(!isTarget(k))continue;
    target++;
    const s=statusOf(k);
    if(s==="sober")sober++;
    else if(s==="drank")drank++;
    else if(day>TODAY)left++;
  }
  const unit=data.settings.amount;
  return {target,sober,drank,left,unrecorded:target-sober-drank-left,amount:(sober-drank)*unit,max:target*unit};
}
const yen=n=>"¥"+Math.abs(n).toLocaleString("ja-JP");
const signed=n=>(n>0?"+":n<0?"−":"±")+yen(n);
const kg=n=>(n>0?"+":n<0?"−":"±")+Math.abs(n).toFixed(1);

/* ============ 描画 ============ */
let vy=TODAY.getFullYear(), vm=TODAY.getMonth();

function drawStreak(){
  $("streakNum").textContent=streak();
  const b=best();
  $("best").textContent=b?"最長記録 "+b+"日":"ここに最長記録が出ます";
  const s=statusOf(TODAY_KEY), t=isTarget(TODAY_KEY);
  $("streakNote").textContent=
    !t ? "今日は対象外の日。ゆっくりどうぞ" :
    s==="sober" ? "今日の分は記録ずみ。えらい" :
    s==="drank" ? "今日はリセット。明日からまた1日目" :
    "今日はまだ未記録です";
  $("askSober").setAttribute("aria-pressed",String(s==="sober"));
  $("askDrank").setAttribute("aria-pressed",String(s==="drank"));
  $("askSober").textContent=t?"今日は飲んでない":"今日は飲んでない（対象外）";
}
function drawLedger(){
  const st=monthStats(vy,vm);
  const cur=(vy===TODAY.getFullYear()&&vm===TODAY.getMonth());
  const a=$("amount");
  a.textContent=signed(st.amount);
  a.className="amount "+(st.amount>0?"plus":st.amount<0?"minus":"");
  $("amountSub").textContent=(vm+1)+"月分・"+(st.amount>0?"旦那からもらう":st.amount<0?"旦那に払う":"貸し借りなし");
  const last=new Date(vy,vm+1,0);
  const rest=Math.round((last-TODAY)/86400000);
  $("settle").innerHTML= cur
    ? "月末精算日<b>"+(vm+1)+"/"+last.getDate()+"("+WD[last.getDay()]+")</b>"+(rest>0?"あと"+rest+"日":"今日です")
    : (rest<0?"精算ずみの月":"これからの月");
  $("nSober").textContent=st.sober;
  $("nDrank").textContent=st.drank;
  $("nLeft").textContent=st.left;
  $("nMax").textContent=yen(st.max);
  const bar=$("bar");
  bar.innerHTML="";
  if(st.target){
    [["bs",st.sober],["bd",st.drank]].forEach(([c,n])=>{
      const i=document.createElement("i"); i.className=c; i.style.width=(n/st.target*100)+"%"; bar.appendChild(i);
    });
  }
}
function drawCalendar(){
  $("month").textContent=vy+"年 "+(vm+1)+"月";
  const grid=$("grid");
  grid.innerHTML="";
  const first=new Date(vy,vm,1);
  for(let i=0;i<first.getDay();i++){
    const b=document.createElement("div"); b.className="cell blank"; grid.appendChild(b);
  }
  const last=new Date(vy,vm+1,0).getDate();
  for(let i=1;i<=last;i++){
    const day=new Date(vy,vm,i), k=keyOf(day);
    const s=statusOf(k), w=weightOf(k), hol=holidayOf(k), t=isTarget(k);
    const c=document.createElement("button");
    c.type="button";
    c.className="cell "+(t?"target":"off")+(s?" "+s:"")+(k===TODAY_KEY?" today":"")+(day>TODAY?" future":"");
    c.dataset.key=k;
    c.setAttribute("aria-label",(vm+1)+"月"+i+"日"+(hol?" "+hol:"")+" "+(s==="sober"?"禁酒":s==="drank"?"飲んだ":"未記録"));
    c.innerHTML=(hol?'<span class="hol">祝</span>':"")+
      '<span class="n">'+i+'</span>'+
      '<span class="m">'+(s==="sober"?"🍵":s==="drank"?"🍺":"")+'</span>'+
      '<span class="kg">'+(w!==null?w.toFixed(1):"")+'</span>';
    grid.appendChild(c);
  }
}
const series=()=>Object.keys(data.records).filter(k=>weightOf(k)!==null).sort()
  .map(k=>({k,d:parseKey(k),v:weightOf(k)}));
function drawWeight(){
  const s=series(), goal=Number(data.settings.goalWeight);
  const has=s.length>0;
  $("wNow").textContent=has?s[s.length-1].v.toFixed(1):"–";
  $("wAll").textContent=s.length>1?kg(s[s.length-1].v-s[0].v):"–";
  const mon=s.filter(p=>p.d.getFullYear()===vy&&p.d.getMonth()===vm);
  $("wMonth").textContent=mon.length>1?kg(mon[mon.length-1].v-mon[0].v):"–";
  $("wGoal").textContent=(has&&goal>0)?kg(s[s.length-1].v-goal):"–";
  const box=$("chart");
  if(s.length<2){
    box.innerHTML='<p class="blank-note">カレンダーの日付をひらいて体重を入れると、<br>ここに推移が出ます</p>';
    return;
  }
  const pts=s.slice(-90);
  const W=520,H=160,L=32,R=8,T=12,B=18;
  const t0=pts[0].d.getTime(), t1=pts[pts.length-1].d.getTime();
  let lo=Math.min.apply(null,pts.map(p=>p.v)), hi=Math.max.apply(null,pts.map(p=>p.v));
  if(goal>0){lo=Math.min(lo,goal);hi=Math.max(hi,goal);}
  if(hi-lo<1){const c=(hi+lo)/2;lo=c-0.6;hi=c+0.6;}
  const padv=(hi-lo)*0.18; lo-=padv; hi+=padv;
  const X=t=>L+(t1===t0?0.5:(t-t0)/(t1-t0))*(W-L-R);
  const Y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);
  const path=pts.map((p,i)=>(i?"L":"M")+X(p.d.getTime()).toFixed(1)+","+Y(p.v).toFixed(1)).join(" ");
  let svg='<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="体重の推移">';
  for(let i=0;i<=2;i++){
    const v=lo+(hi-lo)*i/2, y=Y(v).toFixed(1);
    svg+='<line class="gl" x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'"/>'+
         '<text x="0" y="'+(Number(y)+3).toFixed(1)+'">'+v.toFixed(1)+'</text>';
  }
  if(goal>0&&goal>lo&&goal<hi){
    const y=Y(goal).toFixed(1);
    svg+='<line class="goal" x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'"/>'+
         '<text x="'+(W-R)+'" y="'+(Number(y)-4).toFixed(1)+'" text-anchor="end" fill="var(--gold)">目標 '+goal.toFixed(1)+'</text>';
  }
  svg+='<path class="ar" d="'+path+' L'+X(t1).toFixed(1)+','+Y(lo).toFixed(1)+' L'+X(t0).toFixed(1)+','+Y(lo).toFixed(1)+' Z"/>';
  svg+='<path class="ln" d="'+path+'"/>';
  const e=pts[pts.length-1];
  svg+='<circle class="dot" cx="'+X(e.d.getTime()).toFixed(1)+'" cy="'+Y(e.v).toFixed(1)+'" r="3.5"/>';
  const lab=p=>(p.d.getMonth()+1)+"/"+p.d.getDate();
  svg+='<text x="'+L+'" y="'+(H-4)+'">'+lab(pts[0])+'</text>'+
       '<text x="'+(W-R)+'" y="'+(H-4)+'" text-anchor="end">'+lab(e)+'</text></svg>';
  box.innerHTML=svg;
}
function drawHistory(){
  const months=new Set();
  Object.keys(data.records).forEach(k=>{ if(statusOf(k))months.add(k.slice(0,7)); });
  months.add(TODAY.getFullYear()+"-"+pad(TODAY.getMonth()+1));
  let total=0;
  months.forEach(mk=>{ const p=mk.split("-"); total+=monthStats(+p[0],+p[1]-1).amount; });
  const box=$("history");
  box.innerHTML="";
  Array.from(months).sort().reverse().slice(0,24).forEach(mk=>{
    const p=mk.split("-"), y=+p[0], m=+p[1];
    const st=monthStats(y,m-1);
    const isCur=(y===TODAY.getFullYear()&&m-1===TODAY.getMonth());
    const row=document.createElement("button");
    row.type="button"; row.className="row";
    row.innerHTML='<span class="l"><span class="t">'+y+"年"+m+"月"+(isCur?'<span class="tag">確定前</span>':"")+'</span>'+
      '<span class="d">禁酒 '+st.sober+"日 ・ 飲んだ "+st.drank+"日"+(st.unrecorded>0?" ・ 未記録 "+st.unrecorded+"日":"")+'</span></span>'+
      '<span class="v '+(st.amount>0?"plus":st.amount<0?"minus":"")+'">'+signed(st.amount)+"</span>";
    row.addEventListener("click",()=>{ vy=y; vm=m-1; draw(); window.scrollTo({top:0,behavior:"smooth"}); });
    box.appendChild(row);
  });
  const g=$("grand");
  g.textContent=signed(total);
  g.style.color=total>0?"var(--green)":total<0?"var(--red)":"var(--ink)";
}
function drawSettings(){
  $("setAmount").value=data.settings.amount;
  $("setHoliday").setAttribute("aria-checked",String(!!data.settings.excludeHolidays));
  $("setGoal").value=data.settings.goalWeight;
}
function draw(){ drawStreak(); drawLedger(); drawCalendar(); drawWeight(); drawHistory(); }

/* ============ 保存 ============ */
let cloud=null, pushTimer=null, pushing=false, redo=false;
function setSync(state,text){
  const el=$("sync");
  el.dataset.state=state;
  el.textContent=text;
}
const NOTE_LOCAL="記録はこの端末のブラウザの中だけに保存されています。ブラウザのデータを消すと記録も消えるので、ときどき「バックアップを保存」でファイルに書き出しておいてください。";
const NOTE_CLOUD="記録はこのページ自体に保存されるので、スマホでもパソコンでも同じ記録が見られます（開いた端末にも控えが残ります）。念のため、ときどき「バックアップを保存」でファイルに書き出しておくと安心です。";
function localOnly(){
  cloud=null;
  setSync("local","この端末に保存");
  $("storageNote").textContent=NOTE_LOCAL;
}
function commit(){                     // 変更を確定
  writeLocal(); draw();
  if(cloud){ setSync("pending","保存待ち"); clearTimeout(pushTimer); pushTimer=setTimeout(push,1500); }
}
async function push(){
  if(!cloud)return;
  if(pushing){ redo=true; return; }
  pushing=true; setSync("saving","保存中");
  try{
    await cloud.publish({[DATA_PATH]:JSON.stringify(data)});
    const t=new Date();
    setSync("synced","保存ずみ "+t.getHours()+":"+pad(t.getMinutes()));
  }catch(err){
    const code=err&&err.code;
    if(code==="conflict"){
      setSync("retry","別の端末の記録と統合中");
      let last=0;
      try{ last=Number(sessionStorage.getItem("kinshu-reload"))||0; }catch(e){}
      if(now()-last>60000){
        try{ sessionStorage.setItem("kinshu-reload",String(now())); }catch(e){}
        location.reload(); return;
      }
      setSync("retry","保存できませんでした（この端末には残っています）");
    }else if(code==="rate_limited"||code==="upstream_error"||!code){
      setSync("retry","保存を再試行します");
      clearTimeout(pushTimer); pushTimer=setTimeout(push,15000);
    }else{
      localOnly();
    }
  }finally{
    pushing=false;
    if(redo){ redo=false; clearTimeout(pushTimer); pushTimer=setTimeout(push,1500); }
  }
}
async function initCloud(){
  let api=null;
  try{
    if(window.claude&&typeof window.claude.use==="function")api=await window.claude.use("artifact");
  }catch(e){ api=null; }
  if(!api){ localOnly(); return; }
  cloud=api;
  $("storageNote").textContent=NOTE_CLOUD;
  let remote=null;
  try{
    const res=await fetch(DATA_PATH,{cache:"no-store"});
    if(res.ok)remote=normalize(await res.json());
  }catch(e){ remote=null; }
  if(remote){
    const before=JSON.stringify(data);
    data=merge(data,remote);
    writeLocal(); drawSettings(); draw();
    if(JSON.stringify(data)!==JSON.stringify(remote)&&before!=="{}"){ setSync("pending","保存待ち"); clearTimeout(pushTimer); pushTimer=setTimeout(push,1200); }
    else setSync("synced","保存ずみ");
  }else if(Object.keys(data.records).length){
    setSync("pending","保存待ち"); clearTimeout(pushTimer); pushTimer=setTimeout(push,800);
  }else{
    setSync("synced","保存ずみ");
  }
}
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="hidden"&&cloud&&pushTimer){ clearTimeout(pushTimer); pushTimer=null; push(); }
});

/* ============ 操作 ============ */
function setStatus(k,status){
  const r=data.records[k]||{};
  if(status)r.status=status; else delete r.status;
  r.u=now();
  data.records[k]=r;
  commit();
}
function setWeight(k,v){
  const r=data.records[k]||{};
  if(isFinite(v)&&v>0)r.weight=Math.round(v*10)/10; else delete r.weight;
  r.u=now();
  data.records[k]=r;
  commit();
}
let toastTimer;
function toast(msg){
  const t=$("toast");
  t.textContent=msg; t.classList.add("on");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("on"),1800);
}
function cheer(k,status){
  if(!isTarget(k))return;
  toast(status==="sober"?"🍵 "+yen(data.settings.amount)+" ゲット":"🍺 "+yen(data.settings.amount)+" の支払い");
}
$("askSober").addEventListener("click",()=>{
  const s=statusOf(TODAY_KEY)==="sober"?"":"sober";
  setStatus(TODAY_KEY,s); if(s)cheer(TODAY_KEY,s);
});
$("askDrank").addEventListener("click",()=>{
  const s=statusOf(TODAY_KEY)==="drank"?"":"drank";
  setStatus(TODAY_KEY,s); if(s)cheer(TODAY_KEY,s);
});

const sheet=$("sheet");
let editKey=null;
function syncChoices(){
  const s=statusOf(editKey);
  sheet.querySelectorAll(".choice").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.status===s)));
}
function openSheet(k){
  editKey=k;
  const d=parseKey(k), hol=holidayOf(k);
  $("sheetDate").textContent=d.getFullYear()+"年"+(d.getMonth()+1)+"月"+d.getDate()+"日("+WD[d.getDay()]+")";
  $("sheetKind").textContent=isTarget(k)
    ? "平日・精算対象　禁酒 +"+yen(data.settings.amount)+" ／ 飲んだ −"+yen(data.settings.amount)
    : "対象外の日"+(hol?"・"+hol:"")+"　飲んでも記録は途切れません";
  const w=weightOf(k);
  $("sheetWeight").value=w!==null?w:"";
  const prev=series().filter(p=>p.k<k).pop();
  $("sheetHint").textContent=prev?"前回 "+prev.v.toFixed(1)+"kg（"+(prev.d.getMonth()+1)+"/"+prev.d.getDate()+"）":"kgで入力";
  syncChoices();
  sheet.showModal();
}
sheet.querySelectorAll(".choice").forEach(b=>{
  b.addEventListener("click",()=>{
    setStatus(editKey,b.dataset.status);
    syncChoices();
    if(b.dataset.status)cheer(editKey,b.dataset.status);
  });
});
$("sheetWeight").addEventListener("change",e=>setWeight(editKey,Number(e.target.value)));
$("grid").addEventListener("click",e=>{
  const c=e.target.closest(".cell[data-key]");
  if(c)openSheet(c.dataset.key);
});
$("prev").addEventListener("click",()=>{const d=new Date(vy,vm-1,1);vy=d.getFullYear();vm=d.getMonth();draw();});
$("next").addEventListener("click",()=>{const d=new Date(vy,vm+1,1);vy=d.getFullYear();vm=d.getMonth();draw();});
$("jump").addEventListener("click",()=>{vy=TODAY.getFullYear();vm=TODAY.getMonth();draw();});

function touchSettings(){ data.settings.u=now(); commit(); }
$("setAmount").addEventListener("change",e=>{
  const v=Math.max(0,Math.round(Number(e.target.value))||0);
  data.settings.amount=v; e.target.value=v; touchSettings();
});
$("setHoliday").addEventListener("click",e=>{
  data.settings.excludeHolidays=!data.settings.excludeHolidays;
  e.currentTarget.setAttribute("aria-checked",String(data.settings.excludeHolidays));
  touchSettings();
});
$("setGoal").addEventListener("change",e=>{
  const v=Number(e.target.value);
  data.settings.goalWeight=(isFinite(v)&&v>0)?Math.round(v*10)/10:"";
  e.target.value=data.settings.goalWeight; touchSettings();
});
$("exportBtn").addEventListener("click",async()=>{
  const json=JSON.stringify(data,null,2);
  const name="kinshu-backup-"+TODAY_KEY+".json";
  let dl=null;
  try{ if(window.claude&&typeof window.claude.use==="function")dl=await window.claude.use("downloads"); }catch(e){ dl=null; }
  if(dl){
    try{ await dl.save({filename:name,data:json}); toast("バックアップを保存しました"); }
    catch(e){ toast("保存はキャンセルされました"); }
    return;
  }
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([json],{type:"application/json"}));
  a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast("バックアップを保存しました");
});
$("importBtn").addEventListener("click",()=>$("importFile").click());
$("importFile").addEventListener("change",e=>{
  const f=e.target.files[0];
  if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    let parsed=null;
    try{ parsed=JSON.parse(String(r.result)); }catch(err){ parsed=null; }
    const next=parsed?normalize(parsed):null;
    if(!next||!Object.keys(next.records).length){ toast("この形式のファイルは読み込めません"); return; }
    if(!confirm("バックアップの記録を、いまの記録に合わせて取り込みます。よろしいですか？"))return;
    data=merge(data,next); data.settings.u=now();
    drawSettings(); commit(); toast("復元しました");
  };
  r.readAsText(f);
  e.target.value="";
});
$("resetBtn").addEventListener("click",()=>{
  if(!confirm("すべての記録を消します。元に戻せません。よろしいですか？"))return;
  const stamp=now();
  Object.keys(data.records).forEach(k=>{ data.records[k]={u:stamp}; });
  data.settings={...DEFAULTS,u:stamp};
  drawSettings(); commit(); toast("記録を消しました");
});

/* ============ 起動 ============ */
drawSettings(); draw();
$("storageNote").textContent=NOTE_LOCAL;
initCloud();
})();
